<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Demo UPI App</title>
<style>body{margin:0;font-family:system-ui,Arial,sans-serif;background:#0b2447;color:#fff;display:flex;justify-content:center;padding:24px}
.c{background:#fff;color:#1c2530;border-radius:16px;padding:24px;max-width:380px;width:100%;text-align:center}
.a{font-size:2.2rem;font-weight:800;margin:10px 0}.b{background:#2f7de1;color:#fff;border:0;border-radius:10px;padding:14px;width:100%;font-size:1.05rem;font-weight:700}
.t{background:#f2b705;color:#14202e;font-size:.7rem;font-weight:700;padding:2px 8px;border-radius:20px}small{color:#66717f}</style></head><body>
<div class="c"><span class="t">DEMO UPI APP</span><h3>Pay SRM Campus Parking</h3><div class="a">₹{{ '%.2f'|format(o.amount/100) }}</div><small>{{ o.description }}</small>
<p id="m">{% if o.status=='paid' %}✔ Already paid{% else %}<button class="b" id="go">Confirm payment (no PIN needed – demo)</button>{% endif %}</p></div>
<script>const g=document.getElementById('go');if(g)g.onclick=async()=>{g.disabled=true;const r=await fetch('/checkout/{{ o.id }}/pay',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({method:'upi_qr'})});
document.getElementById('m').innerHTML=r.ok?'<h2 style="color:#15803d">✔ Paid</h2><small>You can go back to the computer screen.</small>':'Failed'}</script></body></html>
